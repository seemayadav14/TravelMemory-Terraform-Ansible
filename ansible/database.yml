---
- name: Configure MongoDB database server
  hosts: database
  become: yes

  tasks:
    - name: Install required packages
      apt:
        name:
          - gnupg
          - curl
        state: present
        update_cache: yes

    - name: Add MongoDB GPG key
      shell: |
        curl -fsSL https://pgp.mongodb.com/server-8.0.asc |
        gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
      args:
        creates: /usr/share/keyrings/mongodb-server-8.0.gpg

    - name: Add MongoDB 8.0 repository
      apt_repository:
        repo: "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse"
        state: present
        filename: mongodb-org-8.0

    - name: Install MongoDB
      apt:
        name: mongodb-org
        state: present
        update_cache: yes

    - name: Configure MongoDB network binding
      lineinfile:
        path: /etc/mongod.conf
        regexp: '^  bindIp:'
        line: "  bindIp: 127.0.0.1,{{ ansible_host }}"
      notify: Restart MongoDB

    - name: Enable and start MongoDB
      service:
        name: mongod
        state: started
        enabled: yes

  handlers:
    - name: Restart MongoDB
      service:
        name: mongod
        state: restarted